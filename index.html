<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>x.2</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0b0d18"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="x.2"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    /* ── DARK (default) ── */
    :root {
      --bg:    #0b0d18;
      --srf:   #111422;
      --srf2:  #181c30;
      --bdr:   #1f2440;
      --bdr2:  #2a3060;
      --a1:    #6c5ff5;
      --a2:    #f06a60;
      --a3:    #2ec98a;
      --a4:    #f5b731;
      --txt:   #dde1f5;
      --muted: #6670a0;
      --hbg:   rgba(11,13,24,.82);
      --glow1: rgba(108,95,245,.10);
      --glow2: rgba(46,201,138,.07);
      --r: 14px;
    }

    /* ── LIGHT ── */
    html.light {
      --bg:    #f0f2fa;
      --srf:   #ffffff;
      --srf2:  #e8ecf8;
      --bdr:   #d4d9ef;
      --bdr2:  #b8c0e0;
      --txt:   #1a1e35;
      --muted: #8890b8;
      --hbg:   rgba(240,242,250,.88);
      --glow1: rgba(108,95,245,.07);
      --glow2: rgba(46,201,138,.05);
    }

    body {
      background:var(--bg); color:var(--txt);
      font-family:'DM Sans',sans-serif;
      min-height:100vh; overflow-x:hidden;
      transition:background .3s, color .3s;
    }
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse 55% 40% at 85% 5%,  var(--glow1) 0%, transparent 65%),
        radial-gradient(ellipse 45% 35% at 5%  90%,  var(--glow2) 0%, transparent 65%);
      transition:background .3s;
    }

    /* ── HEADER ── */
    header {
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; justify-content:space-between;
      padding:15px 28px;
      background:var(--hbg);
      border-bottom:1px solid var(--bdr);
      backdrop-filter:blur(18px);
      transition:background .3s, border-color .3s;
    }
    .logo {
      font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem;
      letter-spacing:.5px; display:flex; align-items:center; gap:9px;
      line-height:1;
    }
    .pip {
      width:8px; height:8px; border-radius:50%;
      background:var(--a1); box-shadow:0 0 10px var(--a1);
      animation:pip 2.4s ease-in-out infinite;
    }
    @keyframes pip { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.6} }

    .header-right { display:flex; align-items:center; gap:10px; }

    .date-chip {
      font-size:.73rem; color:var(--muted); font-weight:500;
      background:var(--srf); border:1px solid var(--bdr);
      padding:4px 13px; border-radius:99px;
      transition:background .3s, border-color .3s;
    }

    /* ── THEME TOGGLE ── */
    .theme-btn {
      width:38px; height:22px; border-radius:99px;
      border:1px solid var(--bdr); background:var(--srf2);
      cursor:pointer; position:relative;
      transition:background .25s, border-color .25s;
      flex-shrink:0;
    }
    .theme-btn::after {
      content:''; position:absolute;
      width:16px; height:16px; border-radius:50%;
      top:2px; left:2px;
      background:var(--muted);
      transition:transform .25s, background .25s;
    }
    html.light .theme-btn::after {
      transform:translateX(16px);
      background:var(--a1);
    }
    .theme-icon {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-size:.6rem; pointer-events:none;
      padding-left:20px;
    }
    html.light .theme-icon { padding-left:0; padding-right:20px; }

    /* ── MAIN ── */
    main {
      position:relative; z-index:1;
      max-width:1100px; margin:0 auto;
      padding:26px 20px 70px;
    }

    /* ── TABS ── */
    .tabs {
      display:flex; gap:4px; margin-bottom:26px;
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:99px; padding:5px; width:fit-content;
      transition:background .3s, border-color .3s;
    }
    .tab {
      padding:7px 20px; border-radius:99px; border:none;
      background:transparent; color:var(--muted);
      font-family:'Syne',sans-serif; font-weight:600; font-size:.8rem;
      cursor:pointer; transition:background .2s, color .2s, box-shadow .2s;
      letter-spacing:.3px;
    }
    .tab.active { background:var(--a1); color:#fff; box-shadow:0 3px 14px rgba(108,95,245,.38); }
    .tab:hover:not(.active) { background:var(--srf2); color:var(--txt); }

    .panel { display:none; }
    .panel.active { display:block; animation:up .28s ease; }
    @keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* ── SECTION HEADER ── */
    .sec-hd {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px;
    }
    .sec-ttl { font-family:'Syne',sans-serif; font-size:1.1rem; font-weight:700; }

    /* ── TOOLBAR ── */
    .toolbar { display:flex; gap:7px; }
    .btn {
      display:flex; align-items:center; gap:5px;
      padding:7px 15px; border-radius:9px; border:1px solid var(--bdr);
      font-family:'DM Sans',sans-serif; font-size:.78rem; font-weight:500;
      cursor:pointer; transition:all .18s; white-space:nowrap;
      background:var(--srf2); color:var(--txt);
    }
    .btn-add:hover { background:var(--a1); border-color:var(--a1); color:#fff; box-shadow:0 3px 12px rgba(108,95,245,.35); }
    .btn-del { color:var(--muted); }
    .btn-del:hover { background:rgba(240,106,96,.1); border-color:rgba(240,106,96,.35); color:var(--a2); }
    .btn-del.on { background:rgba(240,106,96,.14); border-color:var(--a2); color:var(--a2); box-shadow:0 3px 10px rgba(240,106,96,.18); }

    /* ── SCHEDULE ── */
    .sched { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:13px; }
    .day-card {
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:var(--r); overflow:hidden;
      transition:border-color .2s, background .3s;
    }
    .day-card:hover { border-color:var(--bdr2); }
    .day-hd {
      padding:10px 15px;
      font-family:'Syne',sans-serif; font-weight:700; font-size:.78rem; letter-spacing:.5px;
      display:flex; align-items:center; gap:7px;
      border-bottom:1px solid var(--bdr);
    }
    .day-hd.senin  { background:rgba(108,95,245,.12); color:#7c6ff5; }
    .day-hd.selasa { background:rgba(240,106,96,.12); color:#e05a50; }
    .day-hd.rabu   { background:rgba(46,201,138,.12); color:#26b87a; }
    .day-hd.kamis  { background:rgba(245,183,49,.12); color:#d4a010; }
    .day-hd.jumat  { background:rgba(96,165,250,.12); color:#4a90d9; }
    html.light .day-hd.senin  { color:#5a4ee0; }
    html.light .day-hd.selasa { color:#c94a40; }
    html.light .day-hd.rabu   { color:#1a9e68; }
    html.light .day-hd.kamis  { color:#b8880a; }
    html.light .day-hd.jumat  { color:#3070c0; }
    .dhp { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.7; }

    .ll { list-style:none; }
    .lr {
      display:flex; align-items:center; gap:10px;
      padding:8px 15px; transition:background .13s;
    }
    .lr:not(:last-child) { border-bottom:1px solid var(--bdr); }
    html.light .lr:not(:last-child) { border-bottom-color:var(--bdr); }
    .lr:hover { background:var(--srf2); }
    .ld { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
    .dot-math  { background:var(--a1); }
    .dot-ipa   { background:var(--a3); }
    .dot-ips   { background:var(--a4); }
    .dot-bindo { background:var(--a2); }
    .dot-bing  { background:#60a5fa; }
    .dot-pjok  { background:#f472b6; }
    .dot-pkn   { background:#a78bfa; }
    .dot-agama { background:#34d399; }
    .dot-seni  { background:#fb923c; }
    .dot-tik   { background:#22d3ee; }
    .dot-bj    { background:#e879f9; }
    .dot-other { background:var(--muted); }
    .lt { font-size:.68rem; color:var(--muted); min-width:76px; font-weight:500; }
    .ln { font-size:.83rem; font-weight:500; flex:1; }
    .lx {
      opacity:0; pointer-events:none;
      display:flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:5px; flex-shrink:0;
      background:rgba(240,106,96,.1); border:1px solid rgba(240,106,96,.3);
      color:var(--a2); font-size:.65rem; cursor:pointer;
      transition:opacity .15s, background .15s, transform .15s;
    }
    .lx:hover { background:rgba(240,106,96,.25); transform:scale(1.1); }
    body.delmode .lx { opacity:1; pointer-events:auto; }
    .day-empty { padding:12px 15px; font-size:.76rem; color:var(--muted); }

    /* ── STATS ── */
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:20px; }
    .stat {
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:12px; padding:16px 18px;
      transition:background .3s, border-color .3s;
    }
    .sn {
      font-family:'Syne',sans-serif; font-size:2.2rem; font-weight:800;
      line-height:1.1; margin-bottom:4px; letter-spacing:-.5px;
    }
    .sl { font-size:.72rem; color:var(--muted); font-weight:500; letter-spacing:.3px; }

    /* ── TASK LIST ── */
    .tlist { display:flex; flex-direction:column; gap:7px; }
    .trow {
      display:flex; align-items:center; gap:12px;
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:12px; padding:13px 15px;
      transition:border-color .18s, transform .18s, background .3s;
    }
    .trow:hover { border-color:var(--bdr2); transform:translateX(3px); }
    .trow.urgent-row { border-left:3px solid var(--a2); }
    .tinfo { flex:1; min-width:0; }
    .ttl { font-size:.86rem; font-weight:500; margin-bottom:2px; }
    .tmeta { font-size:.7rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
    .badge {
      padding:2px 8px; border-radius:99px;
      font-size:.66rem; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    }
    .bu { background:rgba(240,106,96,.12); color:#e05a50; border:1px solid rgba(240,106,96,.22); }
    .bn { background:rgba(108,95,245,.12); color:#6c5ff5; border:1px solid rgba(108,95,245,.22); }
    html.light .bu { color:#c94a40; }
    html.light .bn { color:#5a4ee0; }

    /* task delete x */
    .tx {
      display:none; align-items:center; justify-content:center;
      width:26px; height:26px; border-radius:7px; flex-shrink:0;
      background:rgba(240,106,96,.08); border:1px solid rgba(240,106,96,.28);
      color:var(--a2); font-size:.72rem; cursor:pointer;
      transition:background .15s, transform .15s;
    }
    .tx:hover { background:rgba(240,106,96,.22); transform:scale(1.08); }

    /* ── BUKU ── */
    .bgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:12px; }
    .bcard {
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:var(--r); padding:15px;
      display:flex; flex-direction:column; gap:7px;
      transition:border-color .18s, transform .18s, background .3s;
    }
    .bcard:hover { border-color:var(--bdr2); transform:translateY(-3px); }
    .bcov {
      height:84px; border-radius:8px;
      display:flex; align-items:center; justify-content:center; font-size:1.9rem;
      position:relative;
    }
    .bx {
      display:none; position:absolute; top:6px; right:6px;
      width:22px; height:22px; border-radius:5px;
      background:rgba(240,106,96,.18); border:1px solid rgba(240,106,96,.4);
      color:var(--a2); font-size:.65rem; cursor:pointer;
      align-items:center; justify-content:center;
      transition:background .15s, transform .15s;
    }
    .bx:hover { background:rgba(240,106,96,.32); transform:scale(1.1); }
    body.delmbook .bx { display:flex; }
    .btl { font-family:'Syne',sans-serif; font-weight:700; font-size:.83rem; line-height:1.3; }
    .bsub { font-size:.7rem; color:var(--muted); }
    .bst { margin-top:auto; padding:4px 8px; border-radius:6px; font-size:.68rem; font-weight:600; text-align:center; }
    .sc { background:rgba(46,201,138,.12); color:#1a9e68; }
    html.light .sc { color:#1a9e68; }

    /* ── MODAL ── */
    .ov {
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.5); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center; padding:20px;
    }
    .ov.open { display:flex; animation:fi .18s ease; }
    @keyframes fi { from{opacity:0} to{opacity:1} }
    .modal {
      background:var(--srf); border:1px solid var(--bdr2);
      border-radius:18px; padding:24px; width:100%; max-width:420px;
      animation:si .2s ease; transition:background .3s;
    }
    @keyframes si { from{transform:scale(.93);opacity:0} to{transform:scale(1);opacity:1} }
    .mhd { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .mttl { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; }
    .mcl { cursor:pointer; color:var(--muted); font-size:1rem; line-height:1; transition:color .14s; }
    .mcl:hover { color:var(--txt); }
    .fg { margin-bottom:13px; }
    .fl { display:block; font-size:.72rem; color:var(--muted); font-weight:500; margin-bottom:4px; }
    .fi, .fs {
      width:100%; background:var(--srf2); border:1px solid var(--bdr);
      border-radius:8px; padding:8px 12px; color:var(--txt);
      font-family:'DM Sans',sans-serif; font-size:.83rem;
      outline:none; transition:border-color .18s, background .3s, color .3s; appearance:none;
    }
    .fi:focus, .fs:focus { border-color:var(--a1); }
    .fs option { background:var(--srf2); color:var(--txt); }
    .fr { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .sbtn {
      width:100%; padding:10px; background:var(--a1); color:#fff;
      border:none; border-radius:8px;
      font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem;
      cursor:pointer; transition:background .18s, box-shadow .18s; margin-top:5px;
    }
    .sbtn:hover { background:#5a4ee0; box-shadow:0 4px 16px rgba(108,95,245,.4); }

    /* ── EMPTY ── */
    .empty { text-align:center; padding:40px 20px; color:var(--muted); }
    .ei { font-size:1.8rem; margin-bottom:8px; }
    .et { font-size:.82rem; }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:20px; right:20px; z-index:200;
      background:var(--srf2); border:1px solid var(--a3); color:var(--a3);
      padding:9px 16px; border-radius:9px; font-size:.8rem; font-weight:500;
      transform:translateY(60px); opacity:0;
      transition:all .26s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform:translateY(0); opacity:1; }

    @media (max-width:560px) {
      header { padding:12px 15px; }
      main { padding:16px 12px 60px; }
      .tabs { width:100%; }
      .tab { flex:1; justify-content:center; font-size:.75rem; }
      .fr { grid-template-columns:1fr; }
      .btn { padding:6px 10px; font-size:.74rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span class="pip"></span>x.2</div>
  <div class="header-right">
    <div class="date-chip" id="dateChip"></div>
    <button class="theme-btn" onclick="toggleTheme()" title="Ganti tema">
      <span class="theme-icon" id="themeIcon">☀️</span>
    </button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('jadwal')">Jadwal</button>
    <button class="tab"        onclick="switchTab('tugas')">Tugas</button>
    <button class="tab"        onclick="switchTab('buku')">Buku</button>
  </div>

  <!-- JADWAL -->
  <div class="panel active" id="panel-jadwal">
    <div class="sec-hd">
      <div class="sec-ttl">Jadwal Pelajaran</div>
      <div class="toolbar">
        <button class="btn btn-del" id="jdel" onclick="toggleDel('jadwal')">✕ Hapus</button>
        <button class="btn btn-add" onclick="openModal('jadwal')">＋ Tambah</button>
      </div>
    </div>
    <div class="sched" id="schedGrid"></div>
  </div>

  <!-- TUGAS -->
  <div class="panel" id="panel-tugas">
    <div class="stats" id="taskStats"></div>
    <div class="sec-hd">
      <div class="sec-ttl">Daftar Tugas</div>
      <div class="toolbar">
        <button class="btn btn-del" id="tdel" onclick="toggleDel('tugas')">✕ Hapus</button>
        <button class="btn btn-add" onclick="openModal('tugas')">＋ Tambah</button>
      </div>
    </div>
    <div class="tlist" id="taskList"></div>
  </div>

  <!-- BUKU -->
  <div class="panel" id="panel-buku">
    <div class="sec-hd">
      <div class="sec-ttl">Buku Dikumpulkan</div>
      <div class="toolbar">
        <button class="btn btn-del" id="bdel" onclick="toggleDel('buku')">✕ Hapus</button>
        <button class="btn btn-add" onclick="openModal('buku')">＋ Tambah</button>
      </div>
    </div>
    <div class="bgrid" id="bookGrid"></div>
  </div>
</main>

<!-- MODAL -->
<div class="ov" id="ov" onclick="ovClick(event)">
  <div class="modal">
    <div class="mhd">
      <span class="mttl" id="mTitle"></span>
      <span class="mcl" onclick="closeModal()">✕</span>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCWqH1PUcfsSGfOTcarjKZte6uW80kdDbQ",
  authDomain: "dnx2-27f86.firebaseapp.com",
  projectId: "dnx2-27f86",
  storageBucket: "dnx2-27f86.firebasestorage.app",
  messagingSenderId: "322310162949",
  appId: "1:322310162949:web:ff9da5bdc37dc85927ea6c"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const REF = doc(db, 'x2', 'data');

// ── DEFAULT DATA ──────────────────────────────────────────────────────
const DEFAULT = {
  jadwal:{
    senin: [{jam:'07:00–08:30',mapel:'Matematika',dot:'dot-math'},{jam:'08:30–10:00',mapel:'B. Indonesia',dot:'dot-bindo'},{jam:'10:15–11:45',mapel:'Biologi',dot:'dot-ipa'},{jam:'12:30–14:00',mapel:'Agama',dot:'dot-agama'}],
    selasa:[{jam:'07:00–08:30',mapel:'Sosial',dot:'dot-ips'},{jam:'08:30–10:00',mapel:'B. Inggris',dot:'dot-bing'},{jam:'10:15–11:45',mapel:'PKn',dot:'dot-pkn'},{jam:'12:30–14:00',mapel:'TIK',dot:'dot-tik'}],
    rabu:  [{jam:'07:00–08:30',mapel:'Matematika',dot:'dot-math'},{jam:'08:30–10:00',mapel:'Fisika',dot:'dot-ipa'},{jam:'10:15–11:45',mapel:'Seni Budaya',dot:'dot-seni'},{jam:'12:30–14:00',mapel:'PJOK',dot:'dot-pjok'}],
    kamis: [{jam:'07:00–08:30',mapel:'B. Indonesia',dot:'dot-bindo'},{jam:'08:30–10:00',mapel:'B. Sunda',dot:'dot-bj'},{jam:'10:15–11:45',mapel:'PKn',dot:'dot-pkn'},{jam:'12:30–14:00',mapel:'Ekonomi',dot:'dot-ips'}],
    jumat: [{jam:'07:00–08:30',mapel:'Agama',dot:'dot-agama'},{jam:'08:30–10:00',mapel:'B. Inggris',dot:'dot-bing'},{jam:'10:15–11:30',mapel:'Matematika',dot:'dot-math'}]
  },
  tugas:[
    {id:1,judul:'PR Matematika – Bab 5',mapel:'Matematika',deadline:'2026-05-20'},
    {id:2,judul:'Ringkasan Biologi – Ekosistem',mapel:'Biologi',deadline:'2026-05-22'},
    {id:3,judul:'Cerita Pendek B. Indonesia',mapel:'B. Indonesia',deadline:'2026-05-25'}
  ],
  buku:[
    {id:1,mapel:'Matematika',tgl:'2026-05-10'},
    {id:2,mapel:'Biologi',tgl:'2026-05-10'},
    {id:3,mapel:'Sosial',tgl:'2026-05-15'},
    {id:4,mapel:'B. Inggris',tgl:'2026-05-10'},
    {id:5,mapel:'PKn',tgl:'2026-05-12'}
  ]
};

let data = JSON.parse(JSON.stringify(DEFAULT));

// ── SAVE TO FIREBASE ──────────────────────────────────────────────────
async function save() {
  try { await setDoc(REF, data); }
  catch(e) { console.error('Save error:', e); toast('Gagal menyimpan!'); }
}

// ── LOAD & LISTEN REALTIME ────────────────────────────────────────────
function startListener() {
  onSnapshot(REF, snap => {
    if (snap.exists()) {
      data = snap.data();
    } else {
      setDoc(REF, DEFAULT);
      data = JSON.parse(JSON.stringify(DEFAULT));
    }
    renderAll(true);
  }, err => {
    console.error('Listener error:', err);
    data = JSON.parse(JSON.stringify(DEFAULT));
    renderAll(false);
    toast('Gagal terhubung ke server');
  });
}

function renderAll(fromFirebase = false) {
  renderJadwal(); renderTugas(); renderBuku();
  if (fromFirebase) checkAndNotify();
}

// ── THEME ─────────────────────────────────────────────────────────────
window.toggleTheme = function() {
  const isLight = document.documentElement.classList.toggle('light');
  document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem('x2theme', isLight ? 'light' : 'dark');
};
if (localStorage.getItem('x2theme') === 'light') {
  document.documentElement.classList.add('light');
  document.getElementById('themeIcon').textContent = '🌙';
}

// ── DATE ──────────────────────────────────────────────────────────────
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const now=new Date();
document.getElementById('dateChip').textContent=`${DAYS[now.getDay()]}, ${now.getDate()} ${MON[now.getMonth()]} ${now.getFullYear()}`;

// ── DEL MODE ──────────────────────────────────────────────────────────
const delState = { jadwal:false, tugas:false, buku:false };
window.toggleDel = function(tab) {
  delState[tab] = !delState[tab];
  const isOn = delState[tab];
  const btnId = {jadwal:'jdel', tugas:'tdel', buku:'bdel'}[tab];
  const btn = document.getElementById(btnId);
  btn.classList.toggle('on', isOn);
  btn.textContent = isOn ? '✓ Selesai' : '✕ Hapus';
  if (tab === 'jadwal') document.body.classList.toggle('delmode', isOn);
  else if (tab === 'buku') document.body.classList.toggle('delmbook', isOn);
  else renderTugas();
};

// ── TABS ──────────────────────────────────────────────────────────────
let curTab = 'jadwal';
window.switchTab = function(name) {
  if (delState.jadwal) toggleDel('jadwal');
  if (delState.tugas)  toggleDel('tugas');
  if (delState.buku)   toggleDel('buku');
  curTab = name;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['jadwal','tugas','buku'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
};

// ── MAPS ──────────────────────────────────────────────────────────────
const dotMap={'Matematika':'dot-math','Fisika':'dot-ipa','Biologi':'dot-ipa','Kimia':'dot-ipa','Sosial':'dot-ips','Ekonomi':'dot-ips','Sejarah':'dot-ips','Geografi':'dot-ips','B. Indonesia':'dot-bindo','B. Inggris':'dot-bing','PJOK':'dot-pjok','PKn':'dot-pkn','Agama':'dot-agama','Seni Budaya':'dot-seni','TIK':'dot-tik','B. Sunda':'dot-bj'};
const emojiMap={'Matematika':'📐','Fisika':'⚡','Biologi':'🔬','Kimia':'⚗️','Sosial':'🌏','Ekonomi':'💰','Sejarah':'📜','Geografi':'🗺️','B. Indonesia':'📝','B. Inggris':'🌍','PJOK':'🏃','PKn':'🏛️','Agama':'🕌','Seni Budaya':'🎨','TIK':'💻','B. Sunda':'🎋'};

// ── RENDER JADWAL ─────────────────────────────────────────────────────
function renderJadwal() {
  const names=['senin','selasa','rabu','kamis','jumat'];
  const labels=['Senin','Selasa','Rabu','Kamis','Jumat'];
  document.getElementById('schedGrid').innerHTML = names.map((d,i)=>`
    <div class="day-card">
      <div class="day-hd ${d}"><span class="dhp"></span>${labels[i]}</div>
      <ul class="ll">
        ${(data.jadwal[d]||[]).length ? (data.jadwal[d]||[]).map((l,idx)=>`
          <li class="lr">
            <span class="ld ${l.dot}"></span>
            <span class="lt">${l.jam}</span>
            <span class="ln">${l.mapel}</span>
            <span class="lx" onclick="delLesson('${d}',${idx})">✕</span>
          </li>`).join('') : `<li class="day-empty">Tidak ada pelajaran</li>`}
      </ul>
    </div>`).join('');
}

// ── RENDER TUGAS ──────────────────────────────────────────────────────
function isUrgent(deadline) {
  if (!deadline) return false;
  const diff = (new Date(deadline) - new Date()) / (1000*60*60*24);
  return diff <= 2;
}
function renderTugas() {
  const t = data.tugas||[], total = t.length;
  const urgent = t.filter(x => isUrgent(x.deadline)).length;
  document.getElementById('taskStats').innerHTML=`
    <div class="stat"><div class="sn" style="color:var(--a1)">${total}</div><div class="sl">Total Tugas</div></div>
    <div class="stat"><div class="sn" style="color:var(--a2)">${urgent}</div><div class="sl">Mendesak</div></div>`;
  const el=document.getElementById('taskList');
  if(!t.length){el.innerHTML='<div class="empty"><div class="ei">✏️</div><div class="et">Belum ada tugas</div></div>';return;}
  el.innerHTML=t.map(x=>{
    const dl=x.deadline?new Date(x.deadline).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
    const urg=isUrgent(x.deadline);
    const badge=urg?'bu">Mendesak':'bn">Normal';
    const txStyle=delState.tugas?'display:flex':'';
    return `<div class="trow ${urg?'urgent-row':''}">
      <div class="tinfo">
        <div class="ttl">${x.judul}</div>
        <div class="tmeta"><span>${x.mapel}</span><span>${dl}</span></div>
      </div>
      <span class="badge ${badge}</span>
      <span class="tx" style="${txStyle}" onclick="delTask(${x.id})">✕</span>
    </div>`;
  }).join('');
}

// ── RENDER BUKU ───────────────────────────────────────────────────────
function renderBuku() {
  const g=document.getElementById('bookGrid');
  const buku=data.buku||[];
  if(!buku.length){g.innerHTML='<div class="empty"><div class="ei">📚</div><div class="et">Belum ada buku</div></div>';return;}
  const pal=['rgba(108,95,245,.12)','rgba(46,201,138,.12)','rgba(245,183,49,.12)','rgba(240,106,96,.12)','rgba(96,165,250,.12)'];
  g.innerHTML=buku.map((b,i)=>{
    const emoji=emojiMap[b.mapel]||'📖';
    const tglStr=b.tgl?new Date(b.tgl).toLocaleDateString('id-ID',{day:'numeric',month:'short'}):'';
    return `<div class="bcard">
      <div class="bcov" style="background:${pal[i%pal.length]}">${emoji}<span class="bx" onclick="delBuku(${b.id})">✕</span></div>
      <div class="btl">${b.mapel}</div>
      <div class="bsub">${tglStr}</div>
      <div class="bst sc">Terkumpul</div>
    </div>`;
  }).join('');
}

// ── ACTIONS ───────────────────────────────────────────────────────────
window.delLesson = async function(hari,idx){
  data.jadwal[hari].splice(idx,1);
  await save(); toast('Pelajaran dihapus');
};
window.delTask = async function(id) {
  data.tugas=data.tugas.filter(t=>t.id!==id);
  await save(); toast('Tugas dihapus');
};
window.delBuku = async function(id) {
  data.buku=data.buku.filter(b=>b.id!==id);
  await save(); toast('Buku dihapus');
};

// ── MODAL ─────────────────────────────────────────────────────────────
const subOpts=Object.keys(dotMap).map(s=>`<option>${s}</option>`).join('');
window.openModal = function(type) {
  const titles={jadwal:'Tambah Pelajaran',tugas:'Tambah Tugas',buku:'Tambah Buku'};
  document.getElementById('mTitle').textContent=titles[type];
  let b='';
  if(type==='jadwal') b=`
    <div class="fg"><label class="fl">Hari</label>
      <select class="fs" id="fh"><option value="senin">Senin</option><option value="selasa">Selasa</option><option value="rabu">Rabu</option><option value="kamis">Kamis</option><option value="jumat">Jumat</option></select></div>
    <div class="fr">
      <div class="fg"><label class="fl">Jam Mulai</label><input class="fi" type="time" id="fm" value="07:00"/></div>
      <div class="fg"><label class="fl">Jam Selesai</label><input class="fi" type="time" id="fs2" value="08:30"/></div>
    </div>
    <div class="fg"><label class="fl">Mata Pelajaran</label><select class="fs" id="fp">${subOpts}</select></div>
    <button class="sbtn" onclick="subJadwal()">Simpan</button>`;
  if(type==='tugas') b=`
    <div class="fg"><label class="fl">Judul Tugas</label><input class="fi" type="text" id="fj" placeholder="Contoh: PR Matematika Bab 6"/></div>
    <div class="fg"><label class="fl">Mata Pelajaran</label><select class="fs" id="fp">${subOpts}</select></div>
    <div class="fg"><label class="fl">Deadline</label><input class="fi" type="date" id="fd"/></div>
    <button class="sbtn" onclick="subTugas()">Simpan</button>`;
  if(type==='buku') b=`
    <div class="fg"><label class="fl">Mata Pelajaran</label><select class="fs" id="fp">${subOpts}</select></div>
    <button class="sbtn" onclick="subBuku()">Simpan</button>`;
  document.getElementById('mBody').innerHTML=b;
  document.getElementById('ov').classList.add('open');
};
window.closeModal = function(){document.getElementById('ov').classList.remove('open');};
window.ovClick = function(e){if(e.target===document.getElementById('ov'))closeModal();};
const v=id=>document.getElementById(id)?.value||'';

window.subJadwal = async function(){
  const hari=v('fh'),mulai=v('fm'),selesai=v('fs2'),mapel=v('fp');
  if(!mulai||!selesai||!mapel)return;
  if(!data.jadwal[hari]) data.jadwal[hari]=[];
  data.jadwal[hari].push({jam:`${mulai}–${selesai}`,mapel,dot:dotMap[mapel]||'dot-other'});
  data.jadwal[hari].sort((a,b)=>a.jam.localeCompare(b.jam));
  await save(); closeModal(); toast('Pelajaran ditambahkan');
};
window.subTugas = async function(){
  const judul=v('fj');if(!judul)return;
  if(!data.tugas) data.tugas=[];
  data.tugas.push({id:Date.now(),judul,mapel:v('fp'),deadline:v('fd')});
  await save(); closeModal(); toast('Tugas ditambahkan');
};
window.subBuku = async function(){
  const mapel=v('fp');if(!mapel)return;
  if(!data.buku) data.buku=[];
  data.buku.push({id:Date.now(),mapel,tgl:new Date().toISOString().slice(0,10)});
  await save(); closeModal(); toast('Buku ditambahkan');
};

// ── TOAST ─────────────────────────────────────────────────────────────
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────────────
async function requestNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

function sendNotif(title, body, icon) {
  if (Notification.permission !== 'granted') return;
  new Notification(title, {
    body,
    icon: 'icon-192.png',
    badge: 'icon-192.png',
    vibrate: [200, 100, 200]
  });
}

function checkAndNotify() {
  if (Notification.permission !== 'granted') return;
  const t = data.tugas || [];

  // Cek tugas mendesak
  const urgent = t.filter(x => isUrgent(x.deadline));
  if (urgent.length > 0) {
    const names = urgent.map(x => x.judul).join(', ');
    sendNotif(
      `🔴 ${urgent.length} Tugas Mendesak!`,
      names
    );
  }

  // Cek jadwal hari ini
  const hariMap = ['minggu','senin','selasa','rabu','kamis','jumat','sabtu'];
  const hariIni = hariMap[new Date().getDay()];
  const jadwalHariIni = data.jadwal?.[hariIni] || [];
  if (jadwalHariIni.length > 0) {
    const mapels = jadwalHariIni.map(l => l.mapel).join(', ');
    sendNotif(
      `📅 Jadwal Hari Ini`,
      mapels
    );
  }
}

// ── INIT ──────────────────────────────────────────────────────────────
// Register service worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
// Request notif permission
requestNotifPermission();
// Render default dulu biar tab langsung keliatan
renderAll(false);
// Lalu sambungkan Firebase (akan override dengan data asli)
startListener();
</script>
</body>
</html>

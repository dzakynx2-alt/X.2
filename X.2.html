<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>x.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0b0d18;
      --srf:     #111422;
      --srf2:    #181c30;
      --bdr:     #1f2440;
      --bdr2:    #2a3060;
      --a1: #6c5ff5;
      --a2: #f06a60;
      --a3: #2ec98a;
      --a4: #f5b731;
      --txt: #dde1f5;
      --muted: #6670a0;
      --r: 14px;
    }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse 55% 40% at 85% 5%,  rgba(108,95,245,.10) 0%, transparent 65%),
        radial-gradient(ellipse 45% 35% at 5%  90%,  rgba(46,201,138,.07) 0%, transparent 65%);
    }

    /* HEADER */
    header {
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; justify-content:space-between;
      padding:15px 28px;
      background:rgba(11,13,24,.82);
      border-bottom:1px solid var(--bdr);
      backdrop-filter:blur(18px);
    }
    .logo {
      font-family:'Syne',sans-serif; font-weight:800; font-size:1.2rem;
      letter-spacing:-.5px; display:flex; align-items:center; gap:9px;
    }
    .pip {
      width:8px; height:8px; border-radius:50%;
      background:var(--a1); box-shadow:0 0 10px var(--a1);
      animation:pip 2.4s ease-in-out infinite;
    }
    @keyframes pip { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.6} }
    .date-chip {
      font-size:.73rem; color:var(--muted); font-weight:500;
      background:var(--srf); border:1px solid var(--bdr);
      padding:4px 13px; border-radius:99px;
    }

    /* MAIN */
    main {
      position:relative; z-index:1;
      max-width:1100px; margin:0 auto;
      padding:26px 20px 70px;
    }

    /* TABS */
    .tabs {
      display:flex; gap:4px; margin-bottom:26px;
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:99px; padding:5px; width:fit-content;
    }
    .tab {
      padding:7px 20px; border-radius:99px; border:none;
      background:transparent; color:var(--muted);
      font-family:'Syne',sans-serif; font-weight:600; font-size:.8rem;
      cursor:pointer; transition:background .2s, color .2s, box-shadow .2s;
      letter-spacing:.3px;
    }
    .tab.active { background:var(--a1); color:#fff; box-shadow:0 3px 14px rgba(108,95,245,.38); }
    .tab:hover:not(.active) { background:var(--srf2); color:var(--txt); }

    .panel { display:none; }
    .panel.active { display:block; animation:up .28s ease; }
    @keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* SECTION HEADER */
    .sec-hd {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px;
    }
    .sec-ttl { font-family:'Syne',sans-serif; font-size:1.1rem; font-weight:700; }

    /* TOOLBAR */
    .toolbar { display:flex; gap:7px; }
    .btn {
      display:flex; align-items:center; gap:5px;
      padding:7px 15px; border-radius:9px; border:1px solid var(--bdr);
      font-family:'DM Sans',sans-serif; font-size:.78rem; font-weight:500;
      cursor:pointer; transition:all .18s; white-space:nowrap; background:var(--srf2); color:var(--txt);
    }
    .btn-add:hover { background:var(--a1); border-color:var(--a1); color:#fff; box-shadow:0 3px 12px rgba(108,95,245,.35); }
    .btn-del { color:var(--muted); }
    .btn-del:hover { background:rgba(240,106,96,.1); border-color:rgba(240,106,96,.35); color:var(--a2); }
    .btn-del.on { background:rgba(240,106,96,.14); border-color:var(--a2); color:var(--a2); box-shadow:0 3px 10px rgba(240,106,96,.18); }

    /* SCHEDULE */
    .sched { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:13px; }
    .day-card {
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:var(--r); overflow:hidden; transition:border-color .2s;
    }
    .day-card:hover { border-color:var(--bdr2); }
    .day-hd {
      padding:10px 15px;
      font-family:'Syne',sans-serif; font-weight:700; font-size:.78rem; letter-spacing:.5px;
      display:flex; align-items:center; gap:7px;
      border-bottom:1px solid var(--bdr);
    }
    .day-hd.senin  { background:rgba(108,95,245,.12); color:#a89ffc; }
    .day-hd.selasa { background:rgba(240,106,96,.12); color:#f5a09a; }
    .day-hd.rabu   { background:rgba(46,201,138,.12); color:#6eddb4; }
    .day-hd.kamis  { background:rgba(245,183,49,.12); color:#f5cc6a; }
    .day-hd.jumat  { background:rgba(96,165,250,.12); color:#93c5fd; }
    .dhp { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.7; }

    .ll { list-style:none; }
    .lr {
      display:flex; align-items:center; gap:10px;
      padding:8px 15px; transition:background .13s;
    }
    .lr:not(:last-child) { border-bottom:1px solid rgba(255,255,255,.03); }
    .lr:hover { background:var(--srf2); }
    .ld { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
    .dot-math  { background:var(--a1); }
    .dot-ipa   { background:var(--a3); }
    .dot-ips   { background:var(--a4); }
    .dot-bindo { background:var(--a2); }
    .dot-bing  { background:#60a5fa; }
    .dot-pjok  { background:#f472b6; }
    .dot-pkn   { background:#a78bfa; }
    .dot-agama { background:#34d399; }
    .dot-seni  { background:#fb923c; }
    .dot-tik   { background:#22d3ee; }
    .dot-bj    { background:#e879f9; }
    .dot-other { background:var(--muted); }
    .lt { font-size:.68rem; color:var(--muted); min-width:76px; font-weight:500; }
    .ln { font-size:.83rem; font-weight:500; flex:1; }

    /* delete X on lesson row */
    .lx {
      opacity:0; pointer-events:none;
      display:flex; align-items:center; justify-content:center;
      width:20px; height:20px; border-radius:5px; flex-shrink:0;
      background:rgba(240,106,96,.1); border:1px solid rgba(240,106,96,.3);
      color:var(--a2); font-size:.65rem; cursor:pointer;
      transition:opacity .15s, background .15s, transform .15s;
    }
    .lr:hover .lx { opacity:1; pointer-events:auto; }
    .lx:hover { background:rgba(240,106,96,.25); transform:scale(1.1); }
    /* override: in del-mode always show */
    body.delmode .lx { opacity:1; pointer-events:auto; }

    .day-empty { padding:12px 15px; font-size:.76rem; color:var(--muted); }

    /* STATS */
    .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:20px; }
    .stat {
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:12px; padding:13px 15px;
    }
    .sn { font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; line-height:1; margin-bottom:2px; }
    .sl { font-size:.68rem; color:var(--muted); }

    /* TASK LIST */
    .tlist { display:flex; flex-direction:column; gap:7px; }
    .trow {
      display:flex; align-items:center; gap:12px;
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:12px; padding:13px 15px;
      transition:border-color .18s, transform .18s;
      cursor:pointer;
    }
    .trow:hover { border-color:var(--bdr2); transform:translateX(3px); }
    .trow.done { opacity:.4; }
    .tck {
      width:19px; height:19px; border-radius:5px;
      border:2px solid var(--bdr2); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      transition:all .16s;
    }
    .trow.done .tck { background:var(--a3); border-color:var(--a3); }
    .trow.done .tck::after { content:'✓'; color:#fff; font-size:10px; font-weight:700; }
    .tinfo { flex:1; min-width:0; }
    .ttl { font-size:.86rem; font-weight:500; margin-bottom:2px; }
    .trow.done .ttl { text-decoration:line-through; }
    .tmeta { font-size:.7rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
    .badge {
      padding:2px 8px; border-radius:99px;
      font-size:.66rem; font-weight:600; letter-spacing:.4px; text-transform:uppercase;
    }
    .bu { background:rgba(240,106,96,.12); color:#f5a09a; border:1px solid rgba(240,106,96,.22); }
    .bn { background:rgba(108,95,245,.12); color:#a89ffc; border:1px solid rgba(108,95,245,.22); }
    .bd { background:rgba(46,201,138,.12);  color:#6eddb4; border:1px solid rgba(46,201,138,.22); }

    /* task delete x */
    .tx {
      display:none; align-items:center; justify-content:center;
      width:26px; height:26px; border-radius:7px; flex-shrink:0;
      background:rgba(240,106,96,.08); border:1px solid rgba(240,106,96,.28);
      color:var(--a2); font-size:.72rem; cursor:pointer;
      transition:background .15s, transform .15s;
    }
    .tx:hover { background:rgba(240,106,96,.22); transform:scale(1.08); }
    body.delmode .tx { display:flex; }

    /* BUKU */
    .bgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:12px; }
    .bcard {
      background:var(--srf); border:1px solid var(--bdr);
      border-radius:var(--r); padding:15px;
      display:flex; flex-direction:column; gap:7px;
      transition:border-color .18s, transform .18s;
    }
    .bcard:hover { border-color:var(--bdr2); transform:translateY(-3px); }
    .bcov {
      height:84px; border-radius:8px;
      display:flex; align-items:center; justify-content:center; font-size:1.9rem;
      position:relative;
    }
    /* book delete button — top-right of cover */
    .bx {
      display:none; position:absolute; top:6px; right:6px;
      width:22px; height:22px; border-radius:5px;
      background:rgba(240,106,96,.18); border:1px solid rgba(240,106,96,.4);
      color:var(--a2); font-size:.65rem; cursor:pointer;
      align-items:center; justify-content:center;
      transition:background .15s, transform .15s;
    }
    .bx:hover { background:rgba(240,106,96,.32); transform:scale(1.1); }
    body.delmbook .bx { display:flex; }
    .btl { font-family:'Syne',sans-serif; font-weight:700; font-size:.83rem; line-height:1.3; }
    .bsub { font-size:.7rem; color:var(--muted); }
    .bst { margin-top:auto; padding:4px 8px; border-radius:6px; font-size:.68rem; font-weight:600; text-align:center; }
    .sc { background:rgba(46,201,138,.12); color:#6eddb4; }
    .sp { background:rgba(245,183,49,.12);  color:#f5cc6a; }
    .sm { background:rgba(240,106,96,.12);  color:#f5a09a; }

    /* MODAL */
    .ov {
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.6); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center; padding:20px;
    }
    .ov.open { display:flex; animation:fi .18s ease; }
    @keyframes fi { from{opacity:0} to{opacity:1} }
    .modal {
      background:var(--srf); border:1px solid var(--bdr2);
      border-radius:18px; padding:24px; width:100%; max-width:420px;
      animation:si .2s ease;
    }
    @keyframes si { from{transform:scale(.93);opacity:0} to{transform:scale(1);opacity:1} }
    .mhd {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:18px;
    }
    .mttl { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; }
    .mcl { cursor:pointer; color:var(--muted); font-size:1rem; line-height:1; transition:color .14s; }
    .mcl:hover { color:var(--txt); }
    .fg { margin-bottom:13px; }
    .fl { display:block; font-size:.72rem; color:var(--muted); font-weight:500; margin-bottom:4px; }
    .fi, .fs {
      width:100%; background:var(--srf2); border:1px solid var(--bdr);
      border-radius:8px; padding:8px 12px; color:var(--txt);
      font-family:'DM Sans',sans-serif; font-size:.83rem;
      outline:none; transition:border-color .18s; appearance:none;
    }
    .fi:focus, .fs:focus { border-color:var(--a1); }
    .fs option { background:var(--srf2); }
    .fr { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .sbtn {
      width:100%; padding:10px; background:var(--a1); color:#fff;
      border:none; border-radius:8px;
      font-family:'Syne',sans-serif; font-weight:700; font-size:.85rem;
      cursor:pointer; transition:background .18s, box-shadow .18s; margin-top:5px;
    }
    .sbtn:hover { background:#5a4ee0; box-shadow:0 4px 16px rgba(108,95,245,.4); }

    /* EMPTY */
    .empty { text-align:center; padding:40px 20px; color:var(--muted); }
    .ei { font-size:1.8rem; margin-bottom:8px; }
    .et { font-size:.82rem; }

    /* TOAST */
    .toast {
      position:fixed; bottom:20px; right:20px; z-index:200;
      background:var(--srf2); border:1px solid var(--a3); color:var(--a3);
      padding:9px 16px; border-radius:9px; font-size:.8rem; font-weight:500;
      transform:translateY(60px); opacity:0;
      transition:all .26s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform:translateY(0); opacity:1; }

    @media (max-width:560px) {
      header { padding:12px 15px; }
      main { padding:16px 12px 60px; }
      .tabs { width:100%; }
      .tab { flex:1; justify-content:center; font-size:.75rem; }
      .fr { grid-template-columns:1fr; }
      .btn { padding:6px 10px; font-size:.74rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span class="pip"></span>x.2</div>
  <div class="date-chip" id="dateChip"></div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('jadwal')">Jadwal</button>
    <button class="tab"        onclick="switchTab('tugas')">Tugas</button>
    <button class="tab"        onclick="switchTab('buku')">Buku</button>
  </div>

  <!-- JADWAL -->
  <div class="panel active" id="panel-jadwal">
    <div class="sec-hd">
      <div class="sec-ttl">Jadwal Pelajaran</div>
      <div class="toolbar">
        <button class="btn btn-del" id="jdel" onclick="toggleDel('jadwal')">✕ Hapus</button>
        <button class="btn btn-add" onclick="openModal('jadwal')">＋ Tambah</button>
      </div>
    </div>
    <div class="sched" id="schedGrid"></div>
  </div>

  <!-- TUGAS -->
  <div class="panel" id="panel-tugas">
    <div class="stats" id="taskStats"></div>
    <div class="sec-hd">
      <div class="sec-ttl">Daftar Tugas</div>
      <div class="toolbar">
        <button class="btn btn-del" id="tdel" onclick="toggleDel('tugas')">✕ Hapus</button>
        <button class="btn btn-add" onclick="openModal('tugas')">＋ Tambah</button>
      </div>
    </div>
    <div class="tlist" id="taskList"></div>
  </div>

  <!-- BUKU -->
  <div class="panel" id="panel-buku">
    <div class="sec-hd">
      <div class="sec-ttl">Buku Dikumpulkan</div>
      <div class="toolbar">
        <button class="btn btn-del" id="bdel" onclick="toggleDel('buku')">✕ Hapus</button>
        <button class="btn btn-add" onclick="openModal('buku')">＋ Tambah</button>
      </div>
    </div>
    <div class="bgrid" id="bookGrid"></div>
  </div>
</main>

<!-- MODAL -->
<div class="ov" id="ov" onclick="ovClick(event)">
  <div class="modal">
    <div class="mhd">
      <span class="mttl" id="mTitle"></span>
      <span class="mcl" onclick="closeModal()">✕</span>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────
let data = JSON.parse(localStorage.getItem('skl3')||'null') || {
  jadwal:{
    senin: [{jam:'07:00–08:30',mapel:'Matematika',dot:'dot-math'},{jam:'08:30–10:00',mapel:'B. Indonesia',dot:'dot-bindo'},{jam:'10:15–11:45',mapel:'IPA',dot:'dot-ipa'},{jam:'12:30–14:00',mapel:'Agama',dot:'dot-agama'}],
    selasa:[{jam:'07:00–08:30',mapel:'IPS',dot:'dot-ips'},{jam:'08:30–10:00',mapel:'B. Inggris',dot:'dot-bing'},{jam:'10:15–11:45',mapel:'PKn',dot:'dot-pkn'},{jam:'12:30–14:00',mapel:'TIK',dot:'dot-tik'}],
    rabu:  [{jam:'07:00–08:30',mapel:'Matematika',dot:'dot-math'},{jam:'08:30–10:00',mapel:'IPA',dot:'dot-ipa'},{jam:'10:15–11:45',mapel:'Seni Budaya',dot:'dot-seni'},{jam:'12:30–14:00',mapel:'PJOK',dot:'dot-pjok'}],
    kamis: [{jam:'07:00–08:30',mapel:'B. Indonesia',dot:'dot-bindo'},{jam:'08:30–10:00',mapel:'B. Jawa',dot:'dot-bj'},{jam:'10:15–11:45',mapel:'PKn',dot:'dot-pkn'},{jam:'12:30–14:00',mapel:'IPS',dot:'dot-ips'}],
    jumat: [{jam:'07:00–08:30',mapel:'Agama',dot:'dot-agama'},{jam:'08:30–10:00',mapel:'B. Inggris',dot:'dot-bing'},{jam:'10:15–11:30',mapel:'Matematika',dot:'dot-math'}]
  },
  tugas:[
    {id:1,judul:'PR Matematika – Bab 5',mapel:'Matematika',deadline:'2026-05-20',prioritas:'urgent',done:false},
    {id:2,judul:'Ringkasan IPA – Ekosistem',mapel:'IPA',deadline:'2026-05-22',prioritas:'normal',done:false},
    {id:3,judul:'Laporan PKn',mapel:'PKn',deadline:'2026-05-18',prioritas:'normal',done:true},
    {id:4,judul:'Cerita Pendek B. Indonesia',mapel:'B. Indonesia',deadline:'2026-05-25',prioritas:'normal',done:false}
  ],
  buku:[
    {id:1,judul:'Matematika Kelas 8',mapel:'Matematika',emoji:'📐',status:'collected',tgl:'2026-05-10'},
    {id:2,judul:'IPA Terpadu',mapel:'IPA',emoji:'🔬',status:'collected',tgl:'2026-05-10'},
    {id:3,judul:'IPS Nusantara',mapel:'IPS',emoji:'🗺️',status:'pending',tgl:'2026-05-15'},
    {id:4,judul:'B. Inggris Explore',mapel:'B. Inggris',emoji:'🌍',status:'missing',tgl:'2026-05-10'},
    {id:5,judul:'PKn Pancasila',mapel:'PKn',emoji:'🏛️',status:'collected',tgl:'2026-05-12'}
  ]
};
const save = () => localStorage.setItem('skl3', JSON.stringify(data));

// ── DATE ──────────────────────────────────────────────────────────────
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const now=new Date();
document.getElementById('dateChip').textContent=`${DAYS[now.getDay()]}, ${now.getDate()} ${MON[now.getMonth()]} ${now.getFullYear()}`;

// ── DEL MODE ──────────────────────────────────────────────────────────
const delState = { jadwal:false, tugas:false, buku:false };
function toggleDel(tab) {
  delState[tab] = !delState[tab];
  const isOn = delState[tab];
  const btnId = {jadwal:'jdel', tugas:'tdel', buku:'bdel'}[tab];
  const btn = document.getElementById(btnId);
  btn.classList.toggle('on', isOn);
  btn.textContent = isOn ? '✓ Selesai' : '✕ Hapus';

  if (tab === 'jadwal') document.body.classList.toggle('delmode', isOn);
  else if (tab === 'buku') document.body.classList.toggle('delmbook', isOn);
  else renderTugas();
}

// ── TABS ──────────────────────────────────────────────────────────────
let curTab = 'jadwal';
function switchTab(name) {
  // auto-exit del mode on tab switch
  if (delState.jadwal) toggleDel('jadwal');
  if (delState.tugas)  toggleDel('tugas');
  if (delState.buku)   toggleDel('buku');
  curTab = name;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['jadwal','tugas','buku'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
}

// ── DOT MAP ───────────────────────────────────────────────────────────
const dotMap={'Matematika':'dot-math','IPA':'dot-ipa','IPS':'dot-ips','B. Indonesia':'dot-bindo','B. Inggris':'dot-bing','PJOK':'dot-pjok','PKn':'dot-pkn','Agama':'dot-agama','Seni Budaya':'dot-seni','TIK':'dot-tik','B. Jawa':'dot-bj'};
const emojiMap={'Matematika':'📐','IPA':'🔬','IPS':'🗺️','B. Indonesia':'📝','B. Inggris':'🌍','PJOK':'🏃','PKn':'🏛️','Agama':'🕌','Seni Budaya':'🎨','TIK':'💻','B. Jawa':'📜'};

// ── RENDER JADWAL ─────────────────────────────────────────────────────
function renderJadwal() {
  const names=['senin','selasa','rabu','kamis','jumat'];
  const labels=['Senin','Selasa','Rabu','Kamis','Jumat'];
  document.getElementById('schedGrid').innerHTML = names.map((d,i)=>`
    <div class="day-card">
      <div class="day-hd ${d}"><span class="dhp"></span>${labels[i]}</div>
      <ul class="ll">
        ${data.jadwal[d].length ? data.jadwal[d].map((l,idx)=>`
          <li class="lr">
            <span class="ld ${l.dot}"></span>
            <span class="lt">${l.jam}</span>
            <span class="ln">${l.mapel}</span>
            <span class="lx" onclick="delLesson('${d}',${idx})">✕</span>
          </li>`).join('') : `<li class="day-empty">Tidak ada pelajaran</li>`}
      </ul>
    </div>`).join('');
}

// ── RENDER TUGAS ──────────────────────────────────────────────────────
function renderTugas() {
  const t=data.tugas, total=t.length;
  const urgent=t.filter(x=>x.prioritas==='urgent').length;
  document.getElementById('taskStats').innerHTML=`
    <div class="stat"><div class="sn" style="color:var(--a1)">${total}</div><div class="sl">Total Tugas</div></div>
    <div class="stat"><div class="sn" style="color:var(--a2)">${urgent}</div><div class="sl">Mendesak</div></div>`;
  const el=document.getElementById('taskList');
  if(!t.length){el.innerHTML='<div class="empty"><div class="ei">✏️</div><div class="et">Belum ada tugas</div></div>';return;}
  el.innerHTML=t.map(x=>{
    const dl=x.deadline?new Date(x.deadline).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
    const badge=x.prioritas==='urgent'?'bu">Mendesak':'bn">Normal';
    const txStyle=delState.tugas?'display:flex':'';
    return `<div class="trow" onclick="void(0)">
      <div class="tinfo">
        <div class="ttl">${x.judul}</div>
        <div class="tmeta"><span>${x.mapel}</span><span>${dl}</span></div>
      </div>
      <span class="badge ${badge}</span>
      <span class="tx" style="${txStyle}" onclick="event.stopPropagation();delTask(${x.id})">✕</span>
    </div>`;
  }).join('');
}

// ── RENDER BUKU ───────────────────────────────────────────────────────
function renderBuku() {
  const g=document.getElementById('bookGrid');
  if(!data.buku.length){g.innerHTML='<div class="empty"><div class="ei">📚</div><div class="et">Belum ada buku</div></div>';return;}
  const pal=['rgba(108,95,245,.12)','rgba(46,201,138,.12)','rgba(245,183,49,.12)','rgba(240,106,96,.12)','rgba(96,165,250,.12)'];
  g.innerHTML=data.buku.map((b,i)=>{
    const [cls,lbl]={collected:['sc','Terkumpul'],pending:['sp','Menunggu'],missing:['sm','Belum Kumpul']}[b.status]||['sp','—'];
    const emoji = emojiMap[b.mapel] || '📖';
    return `<div class="bcard">
      <div class="bcov" style="background:${pal[i%pal.length]}">${emoji}<span class="bx" onclick="delBuku(${b.id})">✕</span></div>
      <div class="btl">${b.judul||b.mapel}</div>
      <div class="bsub">${b.mapel}${b.tgl?' · '+new Date(b.tgl).toLocaleDateString('id-ID',{day:'numeric',month:'short'}):''}</div>
      <div class="bst ${cls}">${lbl}</div>
    </div>`;
  }).join('');
}

// ── ACTIONS ───────────────────────────────────────────────────────────
function toggleTask(id) {
  if (delState.tugas) return; // prevent toggle while in del mode
  const t=data.tugas.find(t=>t.id===id);
  if(t){t.done=!t.done;save();renderTugas();toast(t.done?'Tugas selesai!':'Tugas dibatalkan');}
}
function delLesson(hari,idx) {
  data.jadwal[hari].splice(idx,1);
  save(); renderJadwal(); toast('Pelajaran dihapus');
}
function delTask(id) {
  data.tugas=data.tugas.filter(t=>t.id!==id);
  save(); renderTugas(); toast('Tugas dihapus');
}
function delBuku(id) {
  data.buku=data.buku.filter(b=>b.id!==id);
  save(); renderBuku(); toast('Buku dihapus');
}

// ── MODAL ─────────────────────────────────────────────────────────────
const subOpts=Object.keys(dotMap).map(s=>`<option>${s}</option>`).join('');
const eOpts=['📐','🔬','🗺️','🌍','🏛️','📖','📓','✏️','🎨','🏃','🌱','⚗️'].map(e=>`<option value="${e}">${e}</option>`).join('');

function openModal(type) {
  const titles={jadwal:'Tambah Pelajaran',tugas:'Tambah Tugas',buku:'Tambah Buku'};
  document.getElementById('mTitle').textContent=titles[type];
  let b='';
  if(type==='jadwal') b=`
    <div class="fg"><label class="fl">Hari</label>
      <select class="fs" id="fh"><option value="senin">Senin</option><option value="selasa">Selasa</option><option value="rabu">Rabu</option><option value="kamis">Kamis</option><option value="jumat">Jumat</option></select></div>
    <div class="fr">
      <div class="fg"><label class="fl">Jam Mulai</label><input class="fi" type="time" id="fm" value="07:00"/></div>
      <div class="fg"><label class="fl">Jam Selesai</label><input class="fi" type="time" id="fs2" value="08:30"/></div>
    </div>
    <div class="fg"><label class="fl">Mata Pelajaran</label><select class="fs" id="fp">${subOpts}</select></div>
    <button class="sbtn" onclick="subJadwal()">Simpan</button>`;
  if(type==='tugas') b=`
    <div class="fg"><label class="fl">Judul Tugas</label><input class="fi" type="text" id="fj" placeholder="Contoh: PR Matematika Bab 6"/></div>
    <div class="fg"><label class="fl">Mata Pelajaran</label><select class="fs" id="fp">${subOpts}</select></div>
    <div class="fr">
      <div class="fg"><label class="fl">Deadline</label><input class="fi" type="date" id="fd"/></div>
      <div class="fg"><label class="fl">Prioritas</label><select class="fs" id="fpr"><option value="normal">Normal</option><option value="urgent">Mendesak</option></select></div>
    </div>
    <button class="sbtn" onclick="subTugas()">Simpan</button>`;
  if(type==='buku') b=`
    <div class="fg"><label class="fl">Mata Pelajaran</label><select class="fs" id="fp">${subOpts}</select></div>
    <button class="sbtn" onclick="subBuku()">Simpan</button>`;
  document.getElementById('mBody').innerHTML=b;
  document.getElementById('ov').classList.add('open');
}
function closeModal(){document.getElementById('ov').classList.remove('open');}
function ovClick(e){if(e.target===document.getElementById('ov'))closeModal();}
const v=id=>document.getElementById(id)?.value||'';

function subJadwal(){
  const hari=v('fh'),mulai=v('fm'),selesai=v('fs2'),mapel=v('fp');
  if(!mulai||!selesai||!mapel)return;
  data.jadwal[hari].push({jam:`${mulai}–${selesai}`,mapel,dot:dotMap[mapel]||'dot-other'});
  data.jadwal[hari].sort((a,b)=>a.jam.localeCompare(b.jam));
  save();renderJadwal();closeModal();toast('Pelajaran ditambahkan');
}
function subTugas(){
  const judul=v('fj');if(!judul)return;
  data.tugas.push({id:Date.now(),judul,mapel:v('fp'),deadline:v('fd'),prioritas:v('fpr'),done:false});
  save();renderTugas();closeModal();toast('Tugas ditambahkan');
}
function subBuku(){
  const mapel=v('fp'), status=v('fst');
  if(!mapel)return;
  const emoji=emojiMap[mapel]||'📖';
  data.buku.push({id:Date.now(),judul:mapel,mapel,emoji,status:'collected',tgl:new Date().toISOString().slice(0,10)});
  save();renderBuku();closeModal();toast('Buku ditambahkan');
}

// ── TOAST ─────────────────────────────────────────────────────────────
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2400);
}

// ── INIT ──────────────────────────────────────────────────────────────
renderJadwal();renderTugas();renderBuku();
</script>
</body>
</html>
